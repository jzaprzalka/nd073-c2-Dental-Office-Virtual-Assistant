name: (Template) Build and deploy dentist scheduler to Azure Web App

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'
          cache-dependency-path: starter/ContosoDentistryScheduler/package-lock.json

      - name: Install and test scheduler
        working-directory: ./starter/ContosoDentistryScheduler
        run: |
          npm ci
          npm run build --if-present
          npm run test --if-present

      - name: Upload scheduler artifact
        uses: actions/upload-artifact@v4
        with:
          name: dentist-scheduler-app
          path: ./starter/ContosoDentistryScheduler

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download scheduler artifact
        uses: actions/download-artifact@v4
        with:
          name: dentist-scheduler-app
          path: ./scheduler

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID }}

      - name: Deploy scheduler to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: dentist-scheduler-web-app
          slot-name: Production
          package: ./scheduler
