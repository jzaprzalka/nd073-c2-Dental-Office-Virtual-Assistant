name: Build and deploy dentist scheduler to Azure Web App

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'
          cache-dependency-path: starter/ContosoDentistryScheduler/package-lock.json

      - name: Install and test scheduler
        working-directory: ./starter/ContosoDentistryScheduler
        run: |
          npm ci
          npm test --if-present

      - name: Upload scheduler artifact
        uses: actions/upload-artifact@v4
        with:
          name: dentist-scheduler-app
          path: ./starter/ContosoDentistryScheduler

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download scheduler artifact
        uses: actions/download-artifact@v4
        with:
          name: dentist-scheduler-app
          path: ./scheduler

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_1B04425AE2804DEC9D0E53CE4392D794 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_24E988CFD58841C1AFF685CF9ABA5BDB }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_7AF20ADF2DE543BE9DBF4F872749B438 }}

      - name: Deploy scheduler to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: dentist-scheduler-web-app
          slot-name: Production
          package: ./scheduler
