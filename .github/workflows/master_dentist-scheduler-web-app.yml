# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions
name: Build and deploy dentist scheduler to Azure Web App

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'
          cache-dependency-path: starter/ContosoDentistryScheduler/package-lock.json

      - name: Install and test scheduler
        working-directory: ./starter/ContosoDentistryScheduler
        run: |
          npm ci
          npm run build --if-present
          npm run test --if-present

      - name: Upload scheduler artifact
        uses: actions/upload-artifact@v4
        with:
          name: dentist-scheduler-app
          path: ./starter/ContosoDentistryScheduler

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download scheduler artifact
        uses: actions/download-artifact@v4
        with:
          name: dentist-scheduler-app
          path: ./scheduler

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_98B191E68B794247905F1431A91116CF }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_D68C1CCC3E7142D0B865140FDEC37F9F }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_BB67BB58E23D43E5801F8688CC5CBCA4 }}

      - name: Deploy scheduler to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: dentist-scheduler-web-app
          slot-name: Production
          package: ./scheduler
